<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoBackend</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            padding-top: 80px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>My Todo App</h1>

        <form id="todoForm">
            <input type="text" id="todoInput" placeholder="Enter a todo..." required>

            <button type="submit">Add</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        const form = document.getElementById('todoForm');
        const input = document.getElementById('todoInput');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const title = input.value;

            const response = await fetch('/todos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({title})
            });

            const result = await response.json();

            message.textContent = `Todo created: ${result.title}`;

            message.textContent = result;
            input.value = '';
        });
    </script>

</body>

</html>
